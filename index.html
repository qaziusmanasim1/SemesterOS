<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SemesterOS — a private, offline-first command center for your university semester.">
  <meta name="color-scheme" content="dark light">
  <title>SemesterOS</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#060912" id="theme-color-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SemesterOS">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <a class="brand" href="#/dashboard" aria-label="SemesterOS home">
        <span class="brand-mark">S</span>
        <span class="brand-text">
          <strong>SemesterOS</strong>
          <small>Student command center</small>
        </span>
      </a>

      <div class="nav-scroll">
        <p class="nav-label">Workspace</p>
        <nav class="nav" id="nav-links"></nav>
      </div>

      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>

    <div class="shell-main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-toggle" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar"></button>
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub">Your semester at a glance</p>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="theme-toggle" aria-label="Switch theme" title="Switch theme"></button>
          <div class="quickadd" id="quickadd">
            <button class="btn primary" id="quick-add" aria-haspopup="menu" aria-expanded="false" aria-label="Quick add">
              <span class="plus-glyph" aria-hidden="true">+</span>
              <span class="hide-sm">Quick add</span>
            </button>
            <div class="menu" id="quick-add-menu" role="menu" hidden></div>
          </div>
        </div>
      </header>

      <div id="storage-banner" class="storage-banner" hidden></div>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-scrim" id="scrim" hidden></div>
  <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile navigation"></nav>

  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
